name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write

# The laranail siblings resolve through git rather than Packagist, so every job
# hits the GitHub API to enumerate their refs. Unauthenticated that shares one
# low rate limit across the whole matrix, and jobs start failing with 504s and
# auth errors that look like dependency problems. The token is the built-in
# one; no secret to configure.
env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  release:
    name: Publish the GitHub release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e # v2.34.1
        with:
          php-version: '8.5'
          coverage: none

      - name: Install runtime dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Generate an SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: confetti.cdx.json
          # Attached below alongside the notes, rather than uploaded separately.
          upload-release-assets: false
          upload-artifact: false

      # A release whose notes say "see the changelog" is a release nobody reads.
      # Lift the tagged version's section out and use it as the body.
      - name: Extract this version's changelog section
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { f=1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md)
          {
            echo "body<<__CHANGELOG_EOF__"
            if [ -n "$notes" ]; then
              printf '%s\n' "$notes"
            else
              echo "See [CHANGELOG.md](https://github.com/laranail/confetti/blob/main/CHANGELOG.md)."
            fi
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/laranail/confetti/blob/main/CHANGELOG.md)."
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
          files: confetti.cdx.json
