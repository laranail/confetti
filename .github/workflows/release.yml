name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write

jobs:
  release:
    name: Publish the GitHub release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e # v2.34.1
        with:
          php-version: '8.5'
          coverage: none

      - name: Install runtime dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Generate an SBOM
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          format: cyclonedx-json
          output-file: confetti.cdx.json
          # Attached below alongside the notes, rather than uploaded separately.
          upload-release-assets: false
          upload-artifact: false

      # A release whose notes say "see the changelog" is a release nobody reads.
      # Lift the tagged version's section out and use it as the body.
      - name: Extract this version's changelog section
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { f=1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md)
          {
            echo "body<<__CHANGELOG_EOF__"
            if [ -n "$notes" ]; then
              printf '%s\n' "$notes"
            else
              echo "See [CHANGELOG.md](https://github.com/laranail/confetti/blob/main/CHANGELOG.md)."
            fi
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/laranail/confetti/blob/main/CHANGELOG.md)."
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
          files: confetti.cdx.json
