name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pest:
    name: PHP ${{ matrix.php }} · ${{ matrix.deps }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        stability: [prefer-lowest, prefer-stable]
        # "minimal" removes Filament, Livewire and Inertia entirely. It is the
        # leg that proves the package works on a plain Laravel application.
        # Without it, "Filament is optional" is a claim rather than a fact.
        deps: [full, minimal]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e # v2.34.1
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite3, pdo_sqlite
          ini-values: error_reporting=E_ALL
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ matrix.deps }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}

      - name: Remove the optional integrations
        if: matrix.deps == 'minimal'
        run: |
          composer remove --dev --no-update --no-interaction \
            filament/filament livewire/livewire inertiajs/inertia-laravel

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run the test suite
        run: vendor/bin/pest --colors=always
