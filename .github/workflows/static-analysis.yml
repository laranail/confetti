name: Static analysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The laranail siblings resolve through git rather than Packagist, so every job
# hits the GitHub API to enumerate their refs. Unauthenticated that shares one
# low rate limit across the whole matrix, and jobs start failing with 504s and
# auth errors that look like dependency problems. The token is the built-in
# one; no secret to configure.
env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  analyse:
    name: Pint · PHPStan · Rector
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Check formatting
        run: vendor/bin/laranail-pint --test

      - name: Analyse
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Check for pending refactors
        run: vendor/bin/rector process --dry-run --no-progress-bar
