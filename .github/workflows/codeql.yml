name: Code scanning

on:
  pull_request:
    branches: [main]
  schedule:
    # Findings arrive from new rules as often as from new code, so this runs on
    # a schedule as well as on a push.
    - cron: '44 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CodeQL has no PHP analyser, so this covers the browser runtime only. The PHP
# side is held by PHPStan, the arch boundaries, and the security tests in
# tests/Feature/SecurityTest.php.
jobs:
  analyse:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # The committed bundle is generated and contains all of
          # canvas-confetti, so scanning it reports on someone else's code and
          # buries anything real.
          config: |
            paths-ignore:
              - resources/dist
              - vendor
              - node_modules

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
