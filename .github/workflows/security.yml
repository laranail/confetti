name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '28 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The laranail siblings resolve through git rather than Packagist, so every job
# hits the GitHub API to enumerate their refs. Unauthenticated that shares one
# low rate limit across the whole matrix, and jobs start failing with 504s and
# auth errors that look like dependency problems. The token is the built-in
# one; no secret to configure.
env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  audit:
    name: Composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Resolve composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore composer cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Drop cached laranail archives
        # laranail/* resolve through a single MOVING v0.1.0 tag, so composer's dist
        # cache is keyed on a name whose contents change underneath it. A restored
        # archive is then silently stale: the install reports success and unpacks
        # whatever was cached the first time. Everything else is immutable per
        # version and stays cached.
        # POSIX command via bash: Windows runners default to PowerShell, where this
        # would be a parse error rather than a no-op.
        shell: bash
        run: rm -rf "$(composer config cache-files-dir)/laranail"

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Audit
        run: composer audit --no-interaction

  greps:
    name: Lint greps
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Run the gating greps
        run: bash scripts/lint-greps.sh

      # NamingConventionTest asserts the live registries; this asserts the
      # source, so a name is caught before it is ever registered. It also runs
      # against sibling packages, which is how the family-wide audit was done.
      - name: Verify every registered name carries the vendor
        run: python3 scripts/verify-naming.py

      # verify-naming.py checks what is registered; this checks what still
      # points at the old name. They are different failures: a rename can leave
      # the registration perfect and a Blade tag, a parameterised alias or a
      # bare namespace argument stranded, and each of those was missed by hand.
      - name: Verify nothing still references an unprefixed name
        run: python3 scripts/verify-name-references.py

  pins:
    name: Action pins
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # A SHA pin is the supply-chain control; the version comment beside it is
      # what a reviewer actually reads. Nothing keeps the two in step, and this
      # package shipped a CodeQL pin labelled v3.28.0 whose SHA was a v4 commit.
      # The same run reports a pin left behind a release, which is how
      # setup-php sat fourteen months stale while looking entirely correct.
      - name: Verify every pin is honest and current
        run: python3 scripts/verify-action-pins.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag:
    name: Release currency
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Not on push: the tag is expected to lag between pushing a commit and
    # moving it, and a job that fails for the minute in between is one people
    # learn to ignore. Weekly is soon enough to catch a tag left behind.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v7

      # Pre-1.0 the tag moves and consumers resolve ^0.1 through it, so a tag
      # left behind ships them code without the fixes rather than merely
      # without the features. v0.1.0 here sat behind a security fix.
      - name: Verify the moving tag is on main
        run: bash scripts/verify-tag-currency.sh ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
